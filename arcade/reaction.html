<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><title>Reaction · Arcade</title><link rel="icon" href="data:,"><link rel="stylesheet" href="game-ui.css"><link rel="stylesheet" href="reaction.css"></head>
<body class="arcade-game reaction-game">
<header class="game-header"><a class="arcade-return" href="./">← Arcade</a><span class="brand">Reaction</span><a class="portfolio-return" href="https://www.elidoggart.com/">Portfolio <kbd>hold Esc</kbd></a></header>
<main>
<nav class="levels" aria-label="Level"><button data-level="0" aria-pressed="true"><small>01</small> Direction</button><button data-level="1" aria-pressed="false"><small>02</small> Dots</button><button data-level="2" aria-pressed="false"><small>03</small> Colors</button><button data-level="3" aria-pressed="false"><small>04</small> Math</button></nav>
<section class="arena" aria-label="Reaction game">
<div class="arena-top"><span id="level-name">01 / DIRECTION</span><span id="progress">— / 05</span></div>
<div id="stimulus" hidden><div id="prompt"></div><div class="halves"><div id="left-content"></div><div id="right-content"></div></div><div id="word"></div><div class="tap-zones"><button id="left" aria-label="Choose left"></button><button id="right" aria-label="Choose right"></button></div></div>
<div id="panel"><div class="mark" aria-hidden="true">← <span>·</span> →</div><h1 id="title">Direction</h1><div id="splits" hidden></div><form id="score-form" hidden><div class="score-entry"><input id="initials" placeholder="AAA" maxlength="3" minlength="3" pattern="[A-Za-z]{3}" required autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Three-letter initials"><button type="submit">Save score</button></div></form><p id="save-status" role="status"></p><div class="actions"><button id="start" class="primary" aria-keyshortcuts="Enter">Start →</button><button id="next" hidden>Next level →</button></div></div>
<div class="arena-bottom"><span aria-hidden="true">←</span><span id="trial-status" role="status"></span><span aria-hidden="true">→</span></div>
</section>
<footer class="controls"><div><button id="restart" aria-keyshortcuts="Enter" hidden>Restart</button><button id="scores-open">High scores</button></div></footer>
</main>
<dialog id="scores-dialog" aria-labelledby="scores-title"><button class="close" id="close-scores" aria-label="Close high scores">×</button><h2 id="scores-title">High scores</h2><div id="boards"></div></dialog>
<script type="module" src="reaction.js"></script><script src="arcade.js" defer></script></body></html>
