<!doctype html><meta charset="utf-8"><title>Still occlusion checks</title><style>body{font:13px monospace;margin:16px;background:#f4f4f0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}canvas{width:100%;height:310px;display:block;background:white;border:1px solid #888}h2{font:13px monospace}</style><h1>Still · visibility checks</h1><div class="grid"></div><script type="module">
import {StillGame} from '../still-engine.js?v=depth-flight-1';import {StillRenderer} from '../still-render.js?v=depth-flight-1';
const cases=[['Doorway, oblique',0,5,3.6,-.62,0],['Close partition',0,-2.6,-1.5,-1.2,0],['Corridor, grazing wall',2,.5,-1,.6,0],['Desk from opposite side',0,-7,5,Math.PI,-.25],['Plant beside doorway',0,-5.4,3.8,-.35,-.12],['Overhead, walls and furniture',0,-7,-8,0,0]];
for(const [name,level,x,z,yaw,pitch] of cases){const box=document.createElement('section');box.innerHTML='<h2>'+name+'</h2><canvas></canvas>';document.querySelector('.grid').append(box);const g=new StillGame();g.start();g.level=level;g.loadRoom();Object.assign(g.player,{x,z,yaw,pitch});if(name.startsWith('Overhead')){g.die({origin:{x:7,y:1.3,z:7},impact:{x,y:1.3,z}});g.death.age=2;}else g.state='paused';requestAnimationFrame(()=>{const r=new StillRenderer(box.querySelector('canvas')),start=performance.now();r.draw(g);const p=document.createElement('p');p.textContent=(r.depth?'Depth buffer active':'Fallback')+' · '+(performance.now()-start).toFixed(1)+' ms';box.append(p);});}
</script>
