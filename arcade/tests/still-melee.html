<!doctype html><meta charset="utf-8"><title>Still melee checks</title><style>body{font:14px monospace;background:#eee}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}canvas{width:100%;height:330px;background:white}</style><h1>Still · melee weapons and shorter drops</h1><div class="grid"></div><script type="module">
import {StillGame,MELEE} from '../still-engine.js?v=melee-drops-1';import {StillRenderer} from '../still-render.js?v=melee-drops-1';
for(const kind of Object.keys(MELEE)){for(const swing of [false,true]){const section=document.createElement('section');section.innerHTML=`<h2>${kind} · ${swing?'swing':'ready'}</h2><canvas></canvas><p></p>`;document.querySelector('.grid').append(section);const g=new StillGame();g.start();g.player.held=kind;g.player.kick=swing?.8:0;g.items=[{kind,x:-.6,z:-3,y:.1}];Object.assign(g.enemies[0],{x:.7,z:-2.7,type:'rush',weapon:kind});g.state='paused';const r=new StillRenderer(section.querySelector('canvas'));requestAnimationFrame(()=>{r.draw(g);section.querySelector('p').textContent=`Reach ${MELEE[kind].reach}m · Recovery ${MELEE[kind].cool}s · ${r.depth?'depth active':'fallback'}`});}}
</script>
